server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text formats to save bandwidth behind Cloudflare.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Health check for the compose healthcheck.
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Docker DNS. With a variable in proxy_pass nginx starts even when the server container is down.
    resolver 127.0.0.11 valid=10s;

    # Forward API calls to the server container, keeping the full original path.
    location /api/ {
        set $api_upstream http://server:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Hashed file names never change, so cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static legacy demo: plain HTML files from dashboard/public/legacy-demo, no single page app fallback.
    # absolute_redirect off keeps the redirect relative, so it stays on https behind Cloudflare.
    location = /legacy-demo {
        absolute_redirect off;
        return 301 /legacy-demo/;
    }

    location /legacy-demo/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Single page app: unknown paths get index.html, never cached so a deploy shows at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
