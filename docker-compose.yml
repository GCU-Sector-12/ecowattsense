# EcoWattSense staging stack. Run: docker compose up -d --build
name: ecowattsense

services:
  # server: FastAPI backend and SQLite database (internal port 8000, runs as uid 1000)
  server:
    build: ./server
    # Run as the host user that owns ./data (set ECOWATTSENSE_UID and GID in .env on the VM).
    user: "${ECOWATTSENSE_UID:-1000}:${ECOWATTSENSE_GID:-1000}"
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ECOWATTSENSE_DB_PATH=/app/data/ecowattsense.db
    volumes:
      - ./data:/app/data
      # The API contract file lives in shared/. The server shows it at /api/contract.
      - ./shared:/app/shared:ro
    restart: unless-stopped

  # front: web server for the dashboard, proxies /api to the server (localhost only)
  front:
    build:
      context: ./dashboard
      # Build-time data source of the dashboard. Empty keeps the sample data (EWS_API-19).
      # The .env keys start with ECOWATTSENSE_ because deploy.sh only syncs EWS_ and ECOWATTSENSE_ keys.
      args:
        VITE_DEVICES_DATA_SOURCE: ${ECOWATTSENSE_DEVICES_DATA_SOURCE:-}
        VITE_SUMMARY_DATA_SOURCE: ${ECOWATTSENSE_SUMMARY_DATA_SOURCE:-}
    ports:
      # Bind address: 127.0.0.1 on a laptop. On the VM use the docker0 address (172.17.0.1), so the tunnel container can reach it.
      - "${ECOWATTSENSE_FRONT_BIND:-127.0.0.1}:${ECOWATTSENSE_FRONT_PORT:-8081}:80"
    depends_on:
      - server
    restart: unless-stopped
