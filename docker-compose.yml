# EcoWattSense staging stack. Run: docker compose up -d --build
name: ecowattsense

services:
  # server: FastAPI backend and SQLite database (internal port 8000, runs as uid 1000)
  server:
    build: ./server
    # Run as the host user that owns ./data (set ECOWATTSENSE_UID and GID in .env on the VM).
    user: "${ECOWATTSENSE_UID:-1000}:${ECOWATTSENSE_GID:-1000}"
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ECOWATTSENSE_DB_PATH=/app/data/ecowattsense.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # front: web server for the dashboard, proxies /api to the server (localhost only)
  front:
    build: ./dashboard
    ports:
      # Bind address: 127.0.0.1 on a laptop. On the VM use the docker0 address (172.17.0.1), so the tunnel container can reach it.
      - "${ECOWATTSENSE_FRONT_BIND:-127.0.0.1}:${ECOWATTSENSE_FRONT_PORT:-8081}:80"
    depends_on:
      - server
    restart: unless-stopped
