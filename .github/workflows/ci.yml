# CI: automatic checks on every pull request.
#
# Why this file exists:
#   Eight people merge to dev, and every merge goes straight to the staging
#   server (see deploy-staging.yml). Before this file, nothing checked a pull
#   request before the merge, so one broken change could break staging for
#   everyone. CI runs the tests for us and shows a green or red mark on the PR.
#
# What starts it:
#   A pull request to the branch dev or main (when it is opened, and again for
#   every new commit pushed to it).
#
# What it checks (two jobs, they run at the same time):
#   server     the Python tests (pytest) and the example reports in
#              shared/examples against shared/report_schema.json.
#   dashboard  npm ci, the production build and the Vitest tests.
#
# What it does not touch:
#   The two older workflows stay as they are: deploy-staging.yml (deploy after
#   a merge to dev) and pages.yml (publish the project site).
#
# A linter later (none is added now):
#   When the team adds one, it must check only dashboard/src and
#   server/ecowattsense_server. It must never check dashboard/legacy, which is
#   old code we keep only for reference.
#
# After the first green run (a job for the owner):
#   In GitHub open Settings, Branches, and add a rule for dev and for main.
#   Turn on "Require status checks to pass" and pick the checks "server" and
#   "dashboard". Then a red PR cannot be merged. This is why the job names
#   below are short and must not be renamed: the rule refers to them by name.
#
# No secrets are needed. The workflow only reads the code.

name: CI

on:
  pull_request:
    branches: [dev, main]

# The workflow may only read the repository. A pull request from a fork or
# from a mistake can then never write anything.
permissions:
  contents: read

# One run per pull request. When a new commit arrives, the older run of the
# same PR is cancelled, so we do not waste time on code that is already old.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job 1: the Python side (server tests and the report examples).
  server:
    runs-on: ubuntu-latest
    # A stuck job must not run for hours. Ten minutes is far more than needed.
    timeout-minutes: 10
    steps:
      # Download the code of the pull request into the runner.
      - uses: actions/checkout@v4

      # Install Python 3.12. The pip cache is keyed on the requirements file,
      # so the packages are downloaded again only when that file changes.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      # Install the packages of the server, including pytest.
      - name: Install server packages
        run: pip install -r server/requirements.txt

      # Run the server tests. pytest.ini is in the server folder, so we start
      # pytest from there. The tests also read the files in ../shared.
      - name: Run server tests
        run: pytest
        working-directory: server

      # The checker has its own small requirements file on purpose
      # (it is a developer tool, not part of the server).
      - name: Install report checker packages
        run: pip install -r scripts/requirements-check.txt

      # Check the three example reports against shared/report_schema.json.
      # The step fails (exit code 1) if an example no longer follows the schema.
      - name: Check example reports
        run: python scripts/check_report.py

  # Job 2: the dashboard (React app in the folder dashboard).
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # Every run step below starts in the dashboard folder.
        working-directory: dashboard
    steps:
      # Download the code of the pull request into the runner.
      - uses: actions/checkout@v4

      # Install Node. The version is 22 because dashboard/Dockerfile builds the
      # image with node:22-alpine. The task text said Node 20, but CI must use
      # the same version as the real build, or it could pass here and fail
      # there. The npm cache is keyed on the lock file.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # "npm ci" installs exactly what package-lock.json says. It fails when
      # the lock file and package.json disagree, which is what we want in CI.
      - name: Install packages
        run: npm ci

      # Build the app as the Dockerfile does. A build error shows up here.
      - name: Build
        run: npm run build

      # Run the Vitest tests ("vitest run" runs once and then stops).
      - name: Test
        run: npm test
