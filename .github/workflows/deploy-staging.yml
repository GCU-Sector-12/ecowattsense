# Deploy staging.
# This workflow starts the EcoWattSense staging deploy right after a merge to dev.
# It does not build anything. It opens one SSH connection to the staging VM
# and runs scripts/deploy.sh there. The build happens on the VM.
#
# Repository secrets needed:
#   STAGING_SSH_KEY  private deploy key (its public half is on the VM)
#   STAGING_HOST     address of the VM
#   STAGING_USER     user on the VM
#   DISCORD_WEBHOOK_URL  Discord webhook of the #github channel (optional, for the result message)
#   EWS_CLIENT_KEY       shared secret of the clients (optional, an empty one is not sent)
#   EWS_ADMIN_USERNAME   dashboard admin user name (optional, an empty one is not sent)
#   EWS_ADMIN_PASSWORD   dashboard admin password (optional, an empty one is not sent)
#
# To add a new secret: add one line in the env: block of the deploy step
# and add its name to the for list in the same step.
#
# Push events never expose secrets to pull requests from forks.
name: Deploy staging

on:
  push:
    branches: [dev]
    paths:
      - "server/**"
      - "dashboard/**"
      - "docker-compose.yml"
      - ".env.example"
      - "deploy/staging.env"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/known_hosts <<'HOSTKEY'
          145.241.245.48 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIw6e5H451e+uRh8svlHReiqg5cesOGWWRIw48kISUKi
          HOSTKEY
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}

      - name: Run deploy on the VM
        # The word "deploy" is a placeholder. The key on the VM has a forced
        # command in authorized_keys that always runs scripts/deploy.sh auto,
        # so the command word is ignored. The script reads the settings from stdin.
        # The first line is a marker. The other lines are NAME=value, secrets only.
        # The ssh output is the deploy log. The step fails when deploy.sh fails.
        env:
          EWS_CLIENT_KEY: ${{ secrets.EWS_CLIENT_KEY }}
          EWS_ADMIN_USERNAME: ${{ secrets.EWS_ADMIN_USERNAME }}
          EWS_ADMIN_PASSWORD: ${{ secrets.EWS_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          emit_setting() {
            local value="${!1:-}"
            [ -n "$value" ] || return 0
            case "$value" in
              *$'\n'*) echo "::error::$1 contains a newline"; exit 1 ;;
            esac
            printf '%s=%s\n' "$1" "$value"
          }
          { echo "# ews-env v1"; for name in EWS_CLIENT_KEY EWS_ADMIN_USERNAME EWS_ADMIN_PASSWORD; do emit_setting "$name"; done; } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" deploy

      - name: Tell Discord
        # One short message per run on the #github channel. Runs on success and on failure.
        # Skipped when the DISCORD_WEBHOOK_URL secret is not set.
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "No DISCORD_WEBHOOK_URL secret, skipping"; exit 0; }
          title="$(printf '%s' "$COMMIT_MSG" | head -n 1)"
          text="Deploy staging: $RESULT. Commit ${COMMIT_SHA:0:7} $title. Run: <$RUN_URL>"
          payload="$(python3 -c 'import json, sys; print(json.dumps({"content": sys.argv[1]}))' "$text")"
          curl -fsS -H 'Content-Type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL" > /dev/null
